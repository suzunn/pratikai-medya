<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5ecdc">
<title>Telve &amp; Tarçın · Menü</title>
<style>
  :root {
    --zemin: #f5ecdc;
    --kart: #fbf6ec;
    --metin: #2b211a;
    --soluk: #6e5a49;
    --vurgu: #8a4a22;
    --cizgi: #d9c7ab;
    --nav-h: 56px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--zemin);
    color: var(--metin);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.4;
  }
  header {
    text-align: center;
    padding: 28px 16px 18px;
  }
  .masa {
    display: inline-block;
    margin-bottom: 14px;
    padding: 6px 16px;
    border-radius: 999px;
    background: var(--vurgu);
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: .03em;
  }
  .masa[hidden] { display: none; }
  h1 {
    margin: 0;
    font-weight: normal;
    font-size: clamp(34px, 10vw, 48px);
    letter-spacing: .01em;
  }
  .alt-baslik {
    margin: 4px 0 0;
    color: var(--soluk);
    font-style: italic;
  }
  nav {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(245, 236, 220, .94);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--cizgi);
  }
  nav ul {
    display: flex;
    gap: 8px;
    margin: 0;
    padding: 10px 12px;
    list-style: none;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  nav ul::-webkit-scrollbar { display: none; }
  nav a {
    display: block;
    white-space: nowrap;
    padding: 8px 14px;
    border: 1px solid var(--cizgi);
    border-radius: 999px;
    background: var(--kart);
    color: var(--metin);
    text-decoration: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  nav a.aktif {
    background: var(--vurgu);
    border-color: var(--vurgu);
    color: #fff;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 8px 14px 24px;
  }
  section {
    scroll-margin-top: calc(var(--nav-h) + 8px);
    margin-top: 18px;
    padding: 16px 18px 6px;
    background: var(--kart);
    border: 1px solid var(--cizgi);
    border-radius: 14px;
  }
  h2 {
    margin: 0 0 6px;
    color: var(--vurgu);
    font-size: 17px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  ul.urunler { list-style: none; margin: 0; padding: 0; }
  ul.urunler li {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 12px 0;
    border-bottom: 1px dotted var(--cizgi);
    font-size: 18px;
  }
  ul.urunler li:last-child { border-bottom: 0; }
  .ad { flex: 1; }
  .fiyat { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: bold; }
  footer {
    text-align: center;
    color: var(--soluk);
    font-style: italic;
    font-size: 14px;
    padding: 8px 16px calc(28px + env(safe-area-inset-bottom));
  }
</style>
</head>
<body>

<header>
  <div class="masa" id="masa" hidden></div>
  <h1>Telve &amp; Tarçın</h1>
  <p class="alt-baslik">kahve evi · menü</p>
</header>

<nav aria-label="Kategoriler">
  <ul id="kategoriler"></ul>
</nav>

<main id="menu"></main>

<footer>Fiyatlarımıza KDV dahildir · Pazartesi kapalıyız · 09:00–22:00</footer>

<script>
  const MENU = [
    { id: "sicak", ad: "Sıcak İçecekler", urunler: [
      ["Türk Kahvesi", 90],
      ["Menengiç Kahvesi", 100],
      ["Espresso", 85],
      ["Americano", 105],
      ["Latte", 125],
      ["Salep", 120],
      ["Demlik Çay (2 kişilik)", 70]
    ]},
    { id: "soguk", ad: "Soğuk", urunler: [
      ["Ev Limonatası", 95],
      ["Soğuk Kahve", 130],
      ["Ayran", 45]
    ]},
    { id: "tatlilar", ad: "Tatlılar", urunler: [
      ["San Sebastian", 175],
      ["Fırın Sütlaç", 110],
      ["Tarçınlı Elmalı Kurabiye", 75],
      ["Tahinli Çörek", 70]
    ]},
    { id: "atistirmalik", ad: "Atıştırmalık", urunler: [
      ["Kaşarlı Tost", 120],
      ["Simit Tabağı", 140],
      ["Menemen", 160]
    ]}
  ];

  const nav = document.getElementById("kategoriler");
  const main = document.getElementById("menu");

  for (const kat of MENU) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#" + kat.id;
    a.textContent = kat.ad;
    li.appendChild(a);
    nav.appendChild(li);

    const sec = document.createElement("section");
    sec.id = kat.id;
    const h2 = document.createElement("h2");
    h2.textContent = kat.ad.toLocaleUpperCase("tr-TR");
    sec.appendChild(h2);
    const ul = document.createElement("ul");
    ul.className = "urunler";
    for (const [ad, fiyat] of kat.urunler) {
      const item = document.createElement("li");
      const s1 = document.createElement("span");
      s1.className = "ad";
      s1.textContent = ad;
      const s2 = document.createElement("span");
      s2.className = "fiyat";
      s2.textContent = fiyat + " TL";
      item.append(s1, s2);
      ul.appendChild(item);
    }
    sec.appendChild(ul);
    main.appendChild(sec);
  }

  // Masa numarası: ?masa=5 → "Masa 5" (yalnızca 1–4 haneli sayı kabul edilir)
  const masa = new URLSearchParams(location.search).get("masa");
  if (masa && /^\d{1,4}$/.test(masa.trim())) {
    const el = document.getElementById("masa");
    el.textContent = "Masa " + parseInt(masa, 10);
    el.hidden = false;
  }

  // Yapışkan çubuğun gerçek yüksekliğini kaydırma payına yansıt
  const navEl = document.querySelector("nav");
  const navYukseklik = () =>
    document.documentElement.style.setProperty("--nav-h", navEl.offsetHeight + "px");
  navYukseklik();
  addEventListener("resize", navYukseklik);

  // Düğmeye dokununca bölüme kay (adres çubuğunu kirletmeden)
  const linkler = [...nav.querySelectorAll("a")];
  linkler.forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    document.getElementById(a.hash.slice(1)).scrollIntoView({ behavior: "smooth", block: "start" });
  }));

  // Görünen bölüme göre aktif düğmeyi işaretle
  const aktifYap = id => {
    linkler.forEach(a => {
      const on = a.hash === "#" + id;
      a.classList.toggle("aktif", on);
      if (on) a.scrollIntoView({ block: "nearest", inline: "center" });
    });
  };
  const bolumler = [...main.querySelectorAll("section")];
  const guncelle = () => {
    const sinir = navEl.offsetHeight + 24;
    let aktif = bolumler[0].id;
    for (const s of bolumler) if (s.getBoundingClientRect().top <= sinir) aktif = s.id;
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2)
      aktif = bolumler[bolumler.length - 1].id;
    if (!nav.querySelector('a.aktif[href="#' + aktif + '"]')) aktifYap(aktif);
  };
  addEventListener("scroll", guncelle, { passive: true });
  guncelle();
</script>
</body>
</html>
