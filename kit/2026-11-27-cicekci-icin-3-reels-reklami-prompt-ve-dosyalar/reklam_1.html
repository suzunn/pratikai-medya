<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kırk Sümbül Çiçekçilik · Reklam 1 · Yılbaşı Buketi</title>
<!--
  Reklam 1 — Yılbaşı buketi · 15 sn · tasarım 1080x1920 (9:16) · son karede durur
  0.0–1.5   Açılış: kırmızı hediye paketi ortadan açılır, kar yağmaya başlar
  1.1–4.3   "YILBAŞI" harfleri düşer, "Buketi" belirir; buket parça parça kurulur
  4.6–8.0   İkinci satır değişir: kırmızı güller / beyaz lilyumlar / taze çam dalları
  8.0–11.8  Buket yukarı kayar, fiyat etiketi kurdeleden sallanarak iner
  11.8–15   Kapanış: logo, marka adı, "Sipariş için bize yaz"
  Tüm hareketler CSS @keyframes (saniye). Kar taneleri tohumlu sözde-rastgele sayılarla bir kez
  üretilir; döngüleri kesirli tekrar sayısıyla tam 15. saniyede biter ve olduğu yerde donar.
  Baştan oynatmak için sayfayı yenileyin (F5).
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#12081a;cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;margin:-960px 0 0 -540px;transform:scale(var(--s,.3333));overflow:hidden;color:#fff6ec;
  background:radial-gradient(110% 70% at 50% 40%,#5a2150 0%,#2b1238 58%,#1a0a24 100%);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
.serif{font-family:Georgia,"Times New Roman",Times,serif}
.ornek{display:inline-block;font:600 30px/1 "Segoe UI",system-ui,sans-serif;font-style:normal;letter-spacing:1px;padding:7px 16px 9px;border:3px solid currentColor;border-radius:999px;vertical-align:middle;opacity:.9}

/* ---------- arka plan yıldızları ---------- */
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2s ease-in-out both}
@keyframes tw{0%,100%{transform:scale(.45);opacity:.35}50%{transform:scale(1);opacity:1}}

/* ---------- açılış: hediye paketi ---------- */
.paper{position:absolute;top:0;width:540px;height:1920px;z-index:20;
  background:linear-gradient(to bottom,transparent 900px,#fff6ec 900px,#fff6ec 1020px,transparent 1020px),
             repeating-linear-gradient(45deg,#c81d34 0 44px,#b3172d 44px 88px)}
.paper::after{content:"";position:absolute;top:0;width:60px;height:100%;background:#fff6ec}
.paper.l{left:0;animation:openL .75s cubic-bezier(.65,0,.35,1) .8s both}
.paper.r{left:540px;animation:openR .75s cubic-bezier(.65,0,.35,1) .8s both}
.paper.l::after{right:0}.paper.r::after{left:0}
@keyframes openL{from{transform:none}to{transform:translateX(-112%) rotate(-5deg)}}
@keyframes openR{from{transform:none}to{transform:translateX(112%) rotate(5deg)}}
.obow{position:absolute;left:330px;top:750px;width:420px;height:420px;z-index:21;overflow:visible;
  animation:bowWig .7s ease-in-out 0s both,bowOut .45s ease-in .72s forwards}
@keyframes bowWig{0%{transform:scale(.55) rotate(-12deg)}45%{transform:scale(1.08) rotate(7deg)}75%{transform:scale(.97) rotate(-3deg)}100%{transform:none}}
@keyframes bowOut{from{transform:none;opacity:1}to{transform:scale(1.9) rotate(30deg);opacity:0}}

/* ---------- kar ---------- */
#snow{z-index:15;pointer-events:none;animation:fadeIn .8s linear .8s both}
#snow i{position:absolute;top:0;display:block;animation-name:fall;animation-timing-function:linear;animation-fill-mode:both}
#snow b{display:block;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.7);
  animation-name:drift;animation-timing-function:ease-in-out;animation-direction:alternate;animation-fill-mode:both}
@keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(1960px)}}
@keyframes drift{from{transform:translateX(calc(var(--a) * -1))}to{transform:translateX(var(--a))}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- marka rozeti ---------- */
.chip{position:absolute;top:236px;left:0;width:100%;display:flex;justify-content:center;z-index:5;animation:chipIn .7s cubic-bezier(.2,.8,.3,1) 1.3s both}
.chip>div{display:flex;align-items:center;gap:16px;padding:8px 32px 8px 8px;border-radius:999px;background:rgba(255,246,236,.08);border:2px solid rgba(233,196,106,.55)}
.chip svg{width:68px;height:68px;display:block}
.chip span{font:italic 40px/1 Georgia,"Times New Roman",serif}
@keyframes chipIn{from{transform:translateY(-50px);opacity:0}to{transform:none;opacity:1}}

/* ---------- buket ---------- */
.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,.8,.35,1.25) var(--d) both}
@keyframes pop{0%{transform:scale(0) rotate(-35deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.rise{animation:rise .8s cubic-bezier(.2,.8,.3,1) 1.55s both}
@keyframes rise{from{transform:translateY(420px);opacity:0}to{transform:none;opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse .7s ease-in-out var(--p) 1}
@keyframes pulse{0%,100%{transform:none}50%{transform:scale(1.08)}}
.sway{animation:sway 4s ease-in-out 4.2s both;animation-iteration-count:2.7}
@keyframes sway{0%,100%{transform:rotate(0deg)}25%{transform:rotate(1.4deg)}75%{transform:rotate(-1.4deg)}}
.bq-move{animation:bqUp .75s cubic-bezier(.6,0,.3,1) 8s both}
@keyframes bqUp{from{transform:none}to{transform:translateY(-190px)}}

/* ---------- başlık (kinetik tipografi) ---------- */
.ttl{position:absolute;top:322px;left:0;width:100%;text-align:center;z-index:5;text-shadow:0 8px 30px rgba(15,3,20,.7);
  animation:ttlOut .6s cubic-bezier(.6,0,.9,.4) 7.95s forwards}
@keyframes ttlOut{from{transform:none;opacity:1}to{transform:translateY(-420px);opacity:0}}
.l1{font-weight:900;font-size:170px;line-height:1;letter-spacing:4px;height:178px}
.l1 span{display:inline-block;animation:drop .9s cubic-bezier(.25,.8,.35,1) calc(1.15s + var(--i) * .09s) both}
@keyframes drop{0%{transform:translateY(-460px) rotate(var(--r));opacity:0}55%{transform:translateY(18px) rotate(0deg);opacity:1}75%{transform:translateY(-12px)}100%{transform:none;opacity:1}}
.l2{position:relative;height:150px;font-size:104px;line-height:1.25}
.ph{position:absolute;left:0;top:0;width:100%;font-style:italic;white-space:nowrap}
.p0{color:#ff5a6e;animation:upOut .45s ease-in 4.3s forwards}
.p0 i{display:inline-block;animation:popL .6s cubic-bezier(.3,.8,.35,1.3) calc(1.95s + var(--i) * .07s) both}
@keyframes popL{0%{transform:translateY(90px) scale(.3);opacity:0}100%{transform:none;opacity:1}}
.swoosh{position:absolute;left:320px;top:122px;width:440px;height:40px;overflow:visible}
.swoosh path{fill:none;stroke:#ff5a6e;stroke-width:9;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s ease-out 2.45s both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.p1{color:#ff5a6e;animation:upIn .5s cubic-bezier(.2,.8,.3,1) 4.6s both,upOut .4s ease-in 5.75s forwards}
.p2{color:#ffffff;animation:upIn .5s cubic-bezier(.2,.8,.3,1) 5.8s both,upOut .4s ease-in 6.95s forwards}
.p3{color:#9fe3b9;animation:upIn .5s cubic-bezier(.2,.8,.3,1) 7.0s both}
@keyframes upIn{0%{transform:translateY(80px);opacity:0;filter:blur(14px)}100%{transform:none;opacity:1;filter:blur(0)}}
@keyframes upOut{0%{transform:none;opacity:1;filter:blur(0)}100%{transform:translateY(-80px);opacity:0;filter:blur(14px)}}

/* ---------- fiyat etiketi ---------- */
.swing{position:absolute;left:170px;top:890px;width:740px;height:300px;z-index:6;transform-origin:50% 0;animation:swing 1.9s cubic-bezier(.25,.6,.35,1) 8.35s both}
@keyframes swing{
  0%{transform:translateY(-900px) rotate(-24deg);opacity:0}
  12%{opacity:1}
  40%{transform:translateY(0) rotate(16deg);opacity:1}
  58%{transform:translateY(0) rotate(-9deg)}
  74%{transform:translateY(0) rotate(5deg)}
  88%{transform:translateY(0) rotate(-2deg)}
  100%{transform:translateY(0) rotate(0deg);opacity:1}}
.string{position:absolute;left:368px;top:0;width:4px;height:62px;background:#e9c46a;border-radius:2px}
.tag{position:absolute;left:0;top:44px;width:740px;height:250px;border-radius:34px;overflow:hidden;color:#2b1238;text-align:center;
  background:linear-gradient(#fffaf3,#f4e4d3);box-shadow:0 24px 60px rgba(10,0,20,.55)}
.tag .dash{position:absolute;left:14px;top:14px;right:14px;bottom:14px;border:3px dashed rgba(200,29,52,.4);border-radius:24px}
.tag .hole{position:absolute;left:352px;top:12px;width:36px;height:36px;border-radius:50%;background:#2b1238;border:5px solid #e9c46a}
.tname{position:absolute;top:60px;left:0;width:100%;font-size:46px;line-height:1;font-style:italic;color:#7a3b5c}
.price{position:absolute;top:116px;left:0;width:100%;font-weight:900;font-size:112px;line-height:1;color:#c81d34;letter-spacing:-2px;white-space:nowrap}
.price small{font-size:64px;letter-spacing:0}
.price .ornek{color:#7a5a6e;margin-left:16px;letter-spacing:1px;position:relative;top:-8px}
.tag::after{content:"";position:absolute;top:0;left:-40%;width:28%;height:100%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.85),rgba(255,255,255,0));transform:skewX(-20deg);animation:shine .9s ease-in-out 9.75s both}
@keyframes shine{from{left:-40%}to{left:135%}}
.sp{transform-box:fill-box;transform-origin:center;animation:spark .9s ease-out var(--d) both}
@keyframes spark{0%{transform:scale(0) rotate(0deg);opacity:0}35%{transform:scale(1.2) rotate(45deg);opacity:1}100%{transform:scale(0) rotate(120deg);opacity:0}}

/* ---------- kapanış ---------- */
#end{z-index:12;background:radial-gradient(90% 55% at 50% 45%,#62224a 0%,#2b1238 62%,#1a0a24 100%);clip-path:circle(0% at 50% 50%);
  animation:endIn .8s cubic-bezier(.7,0,.3,1) 11.8s both}
@keyframes endIn{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(80% at 50% 50%)}}
.e-emb{position:absolute;left:375px;top:420px;width:330px;height:330px;animation:embDrop 1s cubic-bezier(.3,.8,.35,1.15) 12.15s both}
@keyframes embDrop{0%{transform:translateY(-520px) rotate(-35deg);opacity:0}50%{opacity:1}100%{transform:none;opacity:1}}
.e-name{position:absolute;top:790px;left:0;width:100%;text-align:center;font-size:128px;line-height:1.05;font-style:italic}
.e-name span{display:inline-block;animation:flake .8s cubic-bezier(.3,.8,.35,1.1) calc(12.4s + var(--i) * .05s) both}
@keyframes flake{0%{transform:translateY(-240px) rotate(var(--r,12deg));opacity:0}100%{transform:none;opacity:1}}
.e-sub{position:absolute;top:950px;left:0;width:100%;text-align:center;font-weight:600;font-size:44px;letter-spacing:22px;padding-left:22px;color:#cdb6f5;animation:subIn .8s ease-out 12.95s both}
@keyframes subIn{from{transform:scaleX(1.35);opacity:0}to{transform:none;opacity:1}}
.e-line{position:absolute;top:1030px;left:410px;width:260px;height:4px;border-radius:2px;background:#e9c46a;animation:lineIn .6s ease-out 13.1s both}
@keyframes lineIn{from{transform:scaleX(0)}to{transform:none}}
.ctaw{position:absolute;top:1074px;left:0;width:100%;display:flex;justify-content:center}
.cta{display:flex;align-items:center;gap:20px;padding:26px 48px 28px 40px;border-radius:999px;background:#d7263d;color:#fff;font-weight:800;font-size:54px;line-height:1;white-space:nowrap;
  box-shadow:0 16px 44px rgba(215,38,61,.45);animation:ctaIn .65s cubic-bezier(.3,.8,.35,1.35) 13.15s both,ctaPulse 1s ease-in-out 13.9s 1}
.cta svg{width:62px;height:62px;flex:none}
@keyframes ctaIn{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes ctaPulse{0%,50%,100%{transform:none}25%,75%{transform:scale(1.06)}}
.remind{position:absolute;top:1228px;left:0;width:100%;text-align:center;font-size:38px;color:rgba(255,246,236,.88);white-space:nowrap;animation:fadeUp .6s ease-out 13.45s both}
.remind .ornek{margin-left:12px;color:#cdb6f5}
@keyframes fadeUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<!-- ortak çizimler -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <!-- sümbül çiçekçiği -->
  <g id="fl"><circle cx="0" cy="-5.5" r="5.5"/><circle cx="4.8" cy="-2.75" r="5.5"/><circle cx="4.8" cy="2.75" r="5.5"/><circle cx="0" cy="5.5" r="5.5"/><circle cx="-4.8" cy="2.75" r="5.5"/><circle cx="-4.8" cy="-2.75" r="5.5"/><circle r="3" fill="#fff6ec"/></g>
  <!-- logo: sümbül amblemi -->
  <symbol id="logo" viewBox="0 0 200 200">
   <circle cx="100" cy="100" r="94" fill="#2b1238" stroke="#e9c46a" stroke-width="6"/>
   <circle cx="100" cy="100" r="83" fill="none" stroke="#e9c46a" stroke-width="1.5" opacity=".6"/>
   <path d="M100 176V100" stroke="#6fae7c" stroke-width="7" stroke-linecap="round"/>
   <path d="M99 174C72 164 58 138 60 112C80 124 95 148 99 174Z" fill="#6fae7c"/>
   <path d="M101 174C128 164 142 138 140 112C120 124 105 148 101 174Z" fill="#4f8a5b"/>
   <use href="#fl" x="100" y="40" fill="#c2a8f5"/>

   <use href="#fl" x="85" y="66" fill="#c2a8f5"/><use href="#fl" x="100" y="66" fill="#9273dc"/><use href="#fl" x="115" y="66" fill="#c2a8f5"/>
   <use href="#fl" x="83" y="80" fill="#9273dc"/><use href="#fl" x="100" y="80" fill="#c2a8f5"/><use href="#fl" x="117" y="80" fill="#9273dc"/>
   <use href="#fl" x="85" y="94" fill="#c2a8f5"/><use href="#fl" x="100" y="94" fill="#9273dc"/><use href="#fl" x="115" y="94" fill="#c2a8f5"/>
   <use href="#fl" x="92" y="107" fill="#9273dc"/><use href="#fl" x="108" y="107" fill="#9273dc"/>
  </symbol>
  <!-- fiyonk -->
  <g id="bowShape">
   <path d="M-20 15L-90 160L-50 145L-35 180L25 25Z"/>
   <path d="M20 15L90 160L50 145L35 180L-25 25Z"/>
   <path d="M0 0C-100-100-200-80-180 0C-200 80-100 100 0 0Z"/>
   <path d="M0 0C100-100 200-80 180 0C200 80 100 100 0 0Z"/>
   <path d="M-30-8C-80-60-140-50-150 0" fill="none" stroke="rgba(0,0,0,.14)" stroke-width="10" stroke-linecap="round"/>

   <circle r="36"/>
  </g>
  <!-- gül -->
  <g id="rose">
   <circle r="56" fill="#c81d34"/>
   <circle r="44" fill="#d93347"/>
   <path d="M-3 3a6 6 0 1 1 9-6a13 13 0 1 1-22 8a22 22 0 1 1 38-12a32 32 0 1 1-50 26" fill="none" stroke="#8c0f22" stroke-width="5" stroke-linecap="round"/>
   <path d="M-40-30q20-20 44-18" fill="none" stroke="#f06272" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  </g>
  <!-- beyaz lilyum -->
  <g id="lily">
   <g fill="#ffffff" stroke="#e7d9e8" stroke-width="3">
    <path d="M0 0C20-30 16-72 0-96C-16-72-20-30 0 0Z"/>
    <path d="M0 0C20-30 16-72 0-96C-16-72-20-30 0 0Z" transform="rotate(60)"/>
    <path d="M0 0C20-30 16-72 0-96C-16-72-20-30 0 0Z" transform="rotate(120)"/>
    <path d="M0 0C20-30 16-72 0-96C-16-72-20-30 0 0Z" transform="rotate(180)"/>
    <path d="M0 0C20-30 16-72 0-96C-16-72-20-30 0 0Z" transform="rotate(240)"/>
    <path d="M0 0C20-30 16-72 0-96C-16-72-20-30 0 0Z" transform="rotate(300)"/>
   </g>
   <g stroke="#f4b9c4" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M0-16V-70"/><path d="M0-16V-70" transform="rotate(60)"/><path d="M0-16V-70" transform="rotate(120)"/>
    <path d="M0-16V-70" transform="rotate(180)"/><path d="M0-16V-70" transform="rotate(240)"/><path d="M0-16V-70" transform="rotate(300)"/>
   </g>
   <circle r="12" fill="#d7e8a0"/>
   <path d="M0 0L20-35M0 0L40 0M0 0L20 35M0 0L-20 35M0 0L-40 0M0 0L-20-35" stroke="#9fb86a" stroke-width="3"/>
   <g fill="#b5651d"><circle cx="20" cy="-35" r="5"/><circle cx="40" cy="0" r="5"/><circle cx="20" cy="35" r="5"/><circle cx="-20" cy="35" r="5"/><circle cx="-40" cy="0" r="5"/><circle cx="-20" cy="-35" r="5"/></g>
  </g>
  <!-- çam dalı -->
  <path id="pine" fill="none" stroke="#2f7a52" stroke-width="6" stroke-linecap="round"
   d="M0 0V-182 M0-24l-36-22 M0-24l36-22 M0-38l-36-22 M0-38l36-22 M0-52l-36-22 M0-52l36-22 M0-66l-36-22 M0-66l36-22 M0-80l-36-22 M0-80l36-22 M0-94l-34-21 M0-94l34-21 M0-108l-32-20 M0-108l32-20 M0-122l-30-19 M0-122l30-19 M0-136l-26-17 M0-136l26-17 M0-150l-22-14 M0-150l22-14 M0-164l-16-11 M0-164l16-11"/>
  <!-- kırmızı kuşburnu / meyve dalı -->
  <g id="berries">
   <path d="M0 0L-20-40M0 0L18-44M0 0L2-58M0 0L-36-14" stroke="#5b3a2a" stroke-width="3" fill="none"/>
   <g fill="#e0243c"><circle cx="-20" cy="-40" r="11"/><circle cx="18" cy="-44" r="11"/><circle cx="2" cy="-58" r="10"/><circle cx="-36" cy="-14" r="10"/></g>
   <g fill="#fff" opacity=".7"><circle cx="-24" cy="-44" r="3"/><circle cx="14" cy="-48" r="3"/><circle cx="-1" cy="-62" r="3"/><circle cx="-40" cy="-18" r="3"/></g>
  </g>
  <!-- cipso -->
  <g id="breath" fill="#ffffff">
   <circle r="7"/><circle cx="14" cy="-10" r="6"/><circle cx="-12" cy="-14" r="6"/><circle cx="4" cy="-24" r="5"/><circle cx="20" cy="6" r="5"/><circle cx="-18" cy="6" r="5"/><circle cx="-4" cy="14" r="4"/>
  </g>
  <path id="star" d="M0-30C4-6 6-4 30 0C6 4 4 6 0 30C-4 6-6 4-30 0C-6-4-4-6 0-30Z"/>
 </defs>
</svg>

<div id="stage">

 <!-- arka plan yıldızları (döngü tam 15. sn'de biter) -->
 <svg class="layer" viewBox="0 0 1080 1920" style="z-index:1" fill="#e9c46a">
  <g transform="translate(120 430)"><use class="tw" href="#star" style="animation-delay:-.3s;animation-iteration-count:7.65"/></g>
  <g transform="translate(965 400) scale(.8)"><use class="tw" href="#star" style="animation-delay:-1.1s;animation-iteration-count:8.05"/></g>
  <g transform="translate(90 1060) scale(.7)"><use class="tw" href="#star" style="animation-delay:-.7s;animation-iteration-count:7.85"/></g>
  <g transform="translate(990 1010) scale(.9)"><use class="tw" href="#star" style="animation-delay:-1.6s;animation-iteration-count:8.3"/></g>
  <g transform="translate(160 1560) scale(.8)"><use class="tw" href="#star" style="animation-delay:-.1s;animation-iteration-count:7.55"/></g>
  <g transform="translate(920 1600)"><use class="tw" href="#star" style="animation-delay:-1.3s;animation-iteration-count:8.15"/></g>
 </svg>

 <!-- buket -->
 <svg class="layer" viewBox="0 0 1080 1920" style="z-index:2">
  <g class="bq-move">
   <g transform="translate(540 1256)">
    <g class="sway">
     <g transform="translate(0 -416) scale(.8)">
      <g class="rise">
       <path d="M-310-40Q0-100 310-40L66 520H-66Z" fill="#ead8c4"/>
       <path d="M-310-40Q0-100 310-40" fill="none" stroke="#d7263d" stroke-width="8"/>
      </g>
      <g class="pulse" style="--p:7.15s">
       <g class="pop" style="--d:2.0s"><use href="#pine" transform="translate(-100 -60) rotate(-55)"/></g>
       <g class="pop" style="--d:2.08s"><use href="#pine" transform="translate(100 -60) rotate(55)"/></g>
       <g class="pop" style="--d:2.16s"><use href="#pine" transform="translate(-40 -130) rotate(-15)"/></g>
       <g class="pop" style="--d:2.24s"><use href="#pine" transform="translate(40 -130) rotate(15)"/></g>
       <g class="pop" style="--d:2.32s"><use href="#pine" transform="translate(-150 10) rotate(-82)"/></g>
       <g class="pop" style="--d:2.4s"><use href="#pine" transform="translate(150 10) rotate(82)"/></g>
      </g>
      <g class="pulse" style="--p:5.95s">

<script>
(function(){
  // Sahneyi pencereye sığdır (zamanla ilgisi yok)
  var st=document.getElementById('stage');
  function fit(){st.style.setProperty('--s',Math.min(innerWidth/1080,innerHeight/1920));}
  fit();addEventListener('resize',fit);

  // Tohumlu sözde-rastgele (mulberry32): her açılışta aynı kar
  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/0x100000000;};}
  var R=rng(20261225),T=15,h='';
  for(var i=0;i<64;i++){
    var z=R(), D=12-z*5+R()*1.5, d=-R()*D, x=R()*1080, sz=5+z*13,
        Ds=1.6+R()*2.2, ds=-R()*Ds, amp=10+R()*30;
    // kesirli tekrar sayısı: gecikme + süre × sayı = tam 15 sn → kar 15. saniyede donar
    h+='<i style="left:'+x.toFixed(1)+'px;animation-duration:'+D.toFixed(3)+'s;animation-delay:'+d.toFixed(3)+'s;animation-iteration-count:'+((T-d)/D).toFixed(6)+'">'+
       '<b style="width:'+sz.toFixed(1)+'px;height:'+sz.toFixed(1)+'px;opacity:'+(.45+z*.5).toFixed(2)+';--a:'+amp.toFixed(0)+'px;animation-duration:'+Ds.toFixed(3)+'s;animation-delay:'+ds.toFixed(3)+'s;animation-iteration-count:'+((T-ds)/Ds).toFixed(6)+'"></b></i>';
  }
  document.getElementById('snow').innerHTML=h;
})();
</script>
