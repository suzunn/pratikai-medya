<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kırk Sümbül Çiçekçilik · Reklam 3 · İlk Siparişe İndirim</title>
<!--
  Reklam 3 — İlk siparişe kampanya · 15 sn · 1080x1920 · son karede durur
  0.0–1.8   Açılış: koyu zeminde bir tomurcuk açar, yaprakları patlar, lila zemin ortadan açılır
  1.7–4.2   "İlk siparişine" harfleri takla atar; rozet döner gelir, %0 → %20 sayar, "İNDİRİM" çakılır
  4.2–11.5  Rozetin çevresinde çiçekler açar; Doğum günü / Yıl dönümü / Ya da sebepsiz → "Sadece ilk siparişe özel"
  11.6–15   Kapanış: dalgalı mor perde yükselir, logo para gibi döner, "Sipariş için bize yaz"
  Tüm hareketler CSS @keyframes (saniye). Yaprak ve konfetiler tohumlu sözde-rastgele ile bir kez üretilir;
  kapanıştaki yapraklar tam 15. saniyede havada donar. Baştan oynatmak için sayfayı yenileyin (F5).
-->
<style>
@property --n{syntax:'<integer>';inherits:false;initial-value:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#12081a;cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;margin:-960px 0 0 -540px;transform:scale(var(--s,.3333));overflow:hidden;color:#2b1238;background:#2b1238;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
.serif{font-family:Georgia,"Times New Roman",Times,serif}
.ornek{display:inline-block;font:600 30px/1 "Segoe UI",system-ui,sans-serif;font-style:normal;letter-spacing:1px;padding:7px 16px 9px;border:3px solid currentColor;border-radius:999px;vertical-align:middle;opacity:.9}
.fb{transform-box:fill-box;transform-origin:center}

/* açılış */
.lav{z-index:1;background:radial-gradient(700px 700px at 20% 10%,rgba(255,255,255,.4),rgba(255,255,255,0) 70%),linear-gradient(#d6c6f7,#a78be0);
  clip-path:circle(0% at 50% 50%);animation:reveal .75s cubic-bezier(.6,0,.3,1) 1.05s both}
@keyframes reveal{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(80% at 50% 50%)}}
.obud{animation:budIn .5s cubic-bezier(.3,.8,.35,1.2) 0s both,budOut .6s ease-in 1.05s forwards}
@keyframes budIn{from{transform:scale(.1)}to{transform:none}}
@keyframes budOut{from{transform:none;opacity:1}to{transform:scale(4);opacity:0}}
.pt{animation:ptOpen .55s cubic-bezier(.3,.8,.3,1.25) .35s both}
@keyframes ptOpen{from{transform:rotate(0deg)}to{transform:rotate(var(--a))}}
.oc{animation:popIn .4s cubic-bezier(.3,.8,.35,1.4) .7s both}
#burst{z-index:11;pointer-events:none}
#burst i{position:absolute;display:block;border-radius:0 100% 0 100%;animation-name:burst;animation-timing-function:cubic-bezier(.1,.7,.3,1);animation-fill-mode:both}
@keyframes burst{0%{transform:translate(0,0) rotate(0deg) scale(.3);opacity:0}8%{opacity:1}75%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1);opacity:0}}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}

/* marka rozeti */
.chip{position:absolute;top:236px;left:0;width:100%;display:flex;justify-content:center;z-index:5;animation:chipIn .7s cubic-bezier(.2,.8,.3,1) 1.55s both}
.chip>div{display:flex;align-items:center;gap:16px;padding:8px 32px 8px 8px;border-radius:999px;background:#2b1238;color:#fff6ec}
.chip svg{width:68px;height:68px;display:block}
.chip span{font:italic 40px/1 Georgia,"Times New Roman",serif}
@keyframes chipIn{from{transform:translateY(-50px);opacity:0}to{transform:none;opacity:1}}

/* başlık: harf harf takla */
.tt{position:absolute;top:330px;left:0;width:100%;text-align:center;z-index:5;font-size:116px;line-height:1.1;font-style:italic;white-space:nowrap;perspective:700px}
.tt span{display:inline-block;transform-origin:50% 100%;animation:flipX .6s cubic-bezier(.3,.8,.35,1.2) calc(1.7s + var(--i) * .045s) both}
@keyframes flipX{from{transform:rotateX(-100deg);opacity:0}to{transform:none;opacity:1}}

/* rozet */
.bwrap{position:absolute;left:240px;top:520px;width:600px;height:600px;z-index:5;
  animation:stamp .45s ease-out 5.95s,stamp .45s ease-out 7.1s,stamp .45s ease-out 8.25s,stamp .45s ease-out 9.4s}
@keyframes stamp{0%,100%{transform:none}40%{transform:scale(1.06) rotate(-3deg)}}
.badge{position:absolute;left:0;top:0;width:600px;height:600px;animation:badgeIn .9s cubic-bezier(.3,.8,.3,1.2) 2.15s both}
.badge::before{content:"";position:absolute;left:30px;top:30px;right:30px;bottom:30px;border-radius:50%;box-shadow:0 30px 80px rgba(60,20,90,.38)}
@keyframes badgeIn{from{transform:scale(0) rotate(-220deg)}to{transform:none}}
.scal{position:absolute;left:0;top:0;width:600px;height:600px;animation:spin 11.85s linear 3.15s both}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(45deg)}}
.pct{position:absolute;top:140px;left:0;width:100%;display:flex;justify-content:center;align-items:flex-start;color:#fff6ec;font-weight:900;line-height:1;animation:bumpIn .45s ease-out 3.75s 1}
.pct .sym{font-size:118px;margin:22px 6px 0 0}
.pct .num{font-size:220px;letter-spacing:-6px;min-width:1.2em;text-align:left;font-variant-numeric:tabular-nums;counter-reset:n var(--n);animation:count 1.25s cubic-bezier(.15,.6,.3,1) 2.55s both}
.pct .num::after{content:counter(n)}
@keyframes count{from{--n:0}to{--n:20}}
@keyframes bumpIn{0%,100%{transform:none}40%{transform:scale(1.14)}}
.ind{position:absolute;top:372px;left:0;width:100%;text-align:center;font-weight:800;font-size:66px;line-height:1;letter-spacing:8px;padding-left:8px;animation:slam .5s cubic-bezier(.3,.8,.35,1.2) 3.75s both}
@keyframes slam{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
.bo{position:absolute;top:456px;left:0;width:100%;text-align:center;color:#fff6ec;animation:popIn .4s cubic-bezier(.3,.8,.35,1.5) 4.0s both}

/* çiçekler */
.fpop{animation:popSpin .7s cubic-bezier(.3,.8,.35,1.3) var(--d) both}
@keyframes popSpin{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
.fgrow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.3,.8,.3,1.15) var(--d) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.dsw{animation:dsw 3s ease-in-out 4.9s both;animation-iteration-count:3.3666667}
@keyframes dsw{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.tw{animation:tw 2s ease-in-out both}
@keyframes tw{0%,100%{transform:scale(.45);opacity:.35}50%{transform:scale(1);opacity:1}}

/* durum kelimeleri */
.occ{position:absolute;top:1172px;left:0;width:100%;height:90px;z-index:6;text-align:center;font-weight:700;font-size:68px;line-height:1.2;white-space:nowrap}
.occ>span{position:absolute;left:0;top:0;width:100%}
.o1{animation:zIn .5s cubic-bezier(.2,.8,.3,1) 5.9s both,zOut .35s ease-in 7.0s forwards}
.o2{animation:zIn .5s cubic-bezier(.2,.8,.3,1) 7.05s both,zOut .35s ease-in 8.15s forwards}
.o3{animation:zIn .5s cubic-bezier(.2,.8,.3,1) 8.2s both,zOut .35s ease-in 9.3s forwards}
.o4{animation:zIn .5s cubic-bezier(.2,.8,.3,1) 9.35s both}
.hlt{position:relative;display:inline-block}
.hlt::before{content:"";position:absolute;left:-12px;right:-12px;bottom:8px;height:28px;border-radius:6px;background:#ff6f8e;opacity:.6;z-index:-1;transform:scaleX(0);transform-origin:left;animation:hl .5s ease-out 9.75s both}
@keyframes hl{from{transform:scaleX(0)}to{transform:none}}
@keyframes zIn{0%{transform:scale(2.2);opacity:0;filter:blur(12px)}100%{transform:none;opacity:1;filter:blur(0)}}
@keyframes zOut{0%{transform:none;opacity:1}100%{transform:scale(.6);opacity:0}}
#confetti{z-index:8;pointer-events:none}
#confetti i{position:absolute;top:0;display:block;animation-name:cfall;animation-timing-function:cubic-bezier(.3,.2,.6,1);animation-fill-mode:both}
@keyframes cfall{0%{transform:translateY(-60px) rotate(0deg);opacity:1}85%{opacity:1}100%{transform:translateY(1500px) rotate(var(--r));opacity:0}}

/* kapanış */
.panel{z-index:20;background:radial-gradient(80% 50% at 50% 45%,#4a1f5c 0%,rgba(43,18,56,0) 70%),#2b1238;animation:panelUp .9s cubic-bezier(.7,0,.25,1) 11.55s both}
.panel svg{position:absolute;left:0;top:-178px;width:1080px;height:180px}
@keyframes panelUp{from{transform:translateY(2120px)}to{transform:none}}
#end{z-index:21;color:#fff6ec}
.e-embw{position:absolute;left:375px;top:420px;width:330px;height:330px;perspective:1200px}
.e-emb{width:330px;height:330px;display:block;animation:coin 1.1s cubic-bezier(.2,.7,.3,1) 12.15s both}
@keyframes coin{from{transform:rotateY(-720deg) scale(.3);opacity:0}to{transform:none;opacity:1}}
.e-name{position:absolute;top:790px;left:0;width:100%;text-align:center;font-size:128px;line-height:1.05;font-style:italic;perspective:700px}
.e-name span{display:inline-block;transform-origin:50% 100%;animation:flipX .6s cubic-bezier(.3,.8,.35,1.2) calc(12.55s + var(--i) * .05s) both}
.e-sub{position:absolute;top:950px;left:0;width:100%;text-align:center;font-weight:600;font-size:44px;letter-spacing:22px;padding-left:22px;color:#cdb6f5;animation:fadeIn .7s ease-out 13.1s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.e-line{position:absolute;top:1030px;left:410px;width:260px;height:4px;border-radius:2px;background:#e9c46a;animation:lineIn .6s ease-out 13.2s both}
@keyframes lineIn{from{transform:scaleX(0)}to{transform:none}}
.ctaw{position:absolute;top:1074px;left:0;width:100%;display:flex;justify-content:center}
.cta{display:flex;align-items:center;gap:20px;padding:26px 48px 28px 40px;border-radius:999px;background:#ff6f8e;color:#2b1238;font-weight:800;font-size:54px;line-height:1;white-space:nowrap;
  box-shadow:0 16px 44px rgba(255,111,142,.35);animation:ctaZoom .6s cubic-bezier(.3,.8,.35,1.35) 13.3s both,ctaPulse 1s ease-in-out 14s 1}
.cta svg{width:62px;height:62px;flex:none}
@keyframes ctaZoom{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
@keyframes ctaPulse{0%,50%,100%{transform:none}25%,75%{transform:scale(1.06)}}
.remind{position:absolute;top:1228px;left:0;width:100%;text-align:center;font-size:38px;color:rgba(255,246,236,.88);white-space:nowrap;animation:fadeUp .6s ease-out 13.6s both}
.remind .ornek{margin-left:12px;color:#cdb6f5}
@keyframes fadeUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#petals{z-index:22;pointer-events:none}
#petals i{position:absolute;top:0;display:block;animation-name:pfall;animation-timing-function:linear;animation-fill-mode:both}
#petals b{display:block;border-radius:0 100% 0 100%;animation-name:psway;animation-timing-function:ease-in-out;animation-direction:alternate;animation-fill-mode:both}
@keyframes pfall{from{transform:translateY(-80px) rotate(0deg)}to{transform:translateY(2000px) rotate(var(--r))}}
@keyframes psway{from{transform:translateX(-30px) rotate(-25deg)}to{transform:translateX(30px) rotate(25deg)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <g id="fl"><circle cx="0" cy="-5.5" r="5.5"/><circle cx="4.8" cy="-2.75" r="5.5"/><circle cx="4.8" cy="2.75" r="5.5"/><circle cx="0" cy="5.5" r="5.5"/><circle cx="-4.8" cy="2.75" r="5.5"/><circle cx="-4.8" cy="-2.75" r="5.5"/><circle r="3" fill="#fff6ec"/></g>

   <circle r="26" fill="#f2b544"/><circle r="12" fill="#e09a2a"/>
  </g>
  <g id="tulip">

   <path d="M-16-6C-20-40-10-70 0-84C10-70 20-40 16-6Z" fill="#ff9ab0"/>
  </g>
  <g id="hya">
   <path d="M0 0V-200" stroke="#4f8a5b" stroke-width="8" stroke-linecap="round"/>
   <path d="M-2 0C-30-40-36-90-28-130C-8-90 0-50-2 0Z" fill="#6fae7c"/>
   <use href="#fl" transform="translate(0 -220) scale(1.8)" fill="#8e6ad6"/>
   <use href="#fl" transform="translate(-13 -194) scale(1.8)" fill="#6c4fc0"/><use href="#fl" transform="translate(13 -194) scale(1.8)" fill="#6c4fc0"/>
   <use href="#fl" transform="translate(-19 -166) scale(1.8)" fill="#8e6ad6"/><use href="#fl" transform="translate(0 -166) scale(1.8)" fill="#6c4fc0"/><use href="#fl" transform="translate(19 -166) scale(1.8)" fill="#8e6ad6"/>
   <use href="#fl" transform="translate(-13 -138) scale(1.8)" fill="#6c4fc0"/><use href="#fl" transform="translate(13 -138) scale(1.8)" fill="#6c4fc0"/>
   <use href="#fl" transform="translate(0 -114) scale(1.8)" fill="#8e6ad6"/>
  </g>
  <path id="star" d="M0-30C4-6 6-4 30 0C6 4 4 6 0 30C-4 6-6 4-30 0C-6-4-4-6 0-30Z"/>
 </defs>
</svg>

<div id="stage">
 <div class="layer lav"></div>

 <!-- açılış tomurcuğu -->
 <svg class="layer" viewBox="0 0 1080 1920" style="z-index:12">
  <g transform="translate(540 960)"><g class="obud">
   <g class="pt" style="--a:0deg"><path d="M0,0C46,-40 50,-150 0,-200C-50,-150 -46,-40 0,0Z" fill="#ff8fa8"/></g>
   <g class="pt" style="--a:60deg"><path d="M0,0C46,-40 50,-150 0,-200C-50,-150 -46,-40 0,0Z" fill="#ff6f8e"/></g>

   <g class="pt" style="--a:180deg"><path d="M0,0C46,-40 50,-150 0,-200C-50,-150 -46,-40 0,0Z" fill="#ff6f8e"/></g>

 </svg>
 <div id="burst" class="layer"></div>

 <!-- arka plan parıltıları (15. sn'de biter) -->
 <svg class="layer" viewBox="0 0 1080 1920" style="z-index:2" fill="#fff6ec">
  <g transform="translate(150 480)"><use class="tw fb" href="#star" style="animation-delay:1.2s;animation-iteration-count:6.9"/></g>
  <g transform="translate(940 470) scale(.8)"><use class="tw fb" href="#star" style="animation-delay:1.7s;animation-iteration-count:6.65"/></g>
  <g transform="translate(110 1310) scale(.7)"><use class="tw fb" href="#star" style="animation-delay:1.4s;animation-iteration-count:6.8"/></g>
  <g transform="translate(965 1330) scale(.9)"><use class="tw fb" href="#star" style="animation-delay:2.1s;animation-iteration-count:6.45"/></g>
  <g transform="translate(290 1440) scale(.6)"><use class="tw fb" href="#star" style="animation-delay:1.9s;animation-iteration-count:6.55"/></g>
  <g transform="translate(800 1450) scale(.75)"><use class="tw fb" href="#star" style="animation-delay:1.5s;animation-iteration-count:6.75"/></g>
 </svg>

 <!-- rozet çevresindeki çiçekler -->
 <svg class="layer" viewBox="0 0 1080 1920" style="z-index:3">
  <g class="fgrow" style="--d:4.5s"><use href="#hya" transform="translate(110 1010)"/></g>
  <g class="fgrow" style="--d:4.65s"><use href="#hya" transform="translate(975 990) scale(-1 1)"/></g>

 </svg>

 <div class="chip"><div><svg viewBox="0 0 200 200"><use href="#logo" width="200" height="200"/></svg><span>Kırk Sümbül</span></div></div>

 <div id="end" class="layer">
  <div class="e-embw"><svg class="e-emb" viewBox="0 0 200 200"><use href="#logo" width="200" height="200"/></svg></div>
  <div class="e-name serif"><span style="--i:0">K</span><span style="--i:1">ı</span><span style="--i:2">r</span><span style="--i:3">k</span><span style="--i:4">&nbsp;</span><span style="--i:5">S</span><span style="--i:6">ü</span><span style="--i:7">m</span><span style="--i:8">b</span><span style="--i:9">ü</span><span style="--i:10">l</span></div>
  <div class="e-sub">ÇİÇEKÇİLİK</div>
  <div class="e-line"></div>
  <div class="ctaw"><div class="cta">
   <svg viewBox="0 0 64 64"><path d="M10 8h44a8 8 0 0 1 8 8v24a8 8 0 0 1-8 8H28L14 60V48h-4a8 8 0 0 1-8-8V16a8 8 0 0 1 8-8z" fill="#2b1238"/><circle cx="20" cy="28" r="4.5" fill="#ff6f8e"/><circle cx="32" cy="28" r="4.5" fill="#ff6f8e"/><circle cx="44" cy="28" r="4.5" fill="#ff6f8e"/></svg>
   <span>Sipariş için bize yaz</span></div></div>
  <div class="remind">İlk siparişe %20 indirim<span class="ornek">örnek</span></div>
 </div>
 <div id="petals" class="layer"></div>
</div>

<script>
(function(){
  // Sahneyi pencereye sığdır (zamanla ilgisi yok)
  var st=document.getElementById('stage');
  function fit(){st.style.setProperty('--s',Math.min(innerWidth/1080,innerHeight/1920));}
  fit();addEventListener('resize',fit);

  // Tohumlu sözde-rastgele (mulberry32): her açılışta birebir aynı parçacıklar
  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/0x100000000;};}
  var R=rng(40),T=15,i,h,cols=['#ff6f8e','#ff9ab0','#fff6ec','#c2a8f5','#f2b544'];

  // 1) açılış yaprak patlaması (1.0–2.7 sn, sonunda görünmez)
  h='';
  for(i=0;i<30;i++){
    var a=i/30*Math.PI*2+(R()-.5)*.3, dist=420+R()*620, w=26+R()*30, hh=w*1.6;
    h+='<i style="left:'+(540-w/2).toFixed(1)+'px;top:'+(960-hh/2).toFixed(1)+'px;width:'+w.toFixed(1)+'px;height:'+hh.toFixed(1)+'px;background:'+cols[i%5]+
       ';--x:'+(Math.cos(a)*dist).toFixed(1)+'px;--y:'+(Math.sin(a)*dist).toFixed(1)+'px;--r:'+(R()*720-360).toFixed(0)+'deg;animation-delay:'+(1+R()*.15).toFixed(3)+'s;animation-duration:'+(1.1+R()*.5).toFixed(3)+'s"></i>';
  }
  document.getElementById('burst').innerHTML=h;

  // 2) "Sadece ilk siparişe özel" konfetisi (9.4 sn'den itibaren, tek düşüş)
  h='';
  for(i=0;i<26;i++){
    var cw=14+R()*14;
    h+='<i style="left:'+(R()*1060).toFixed(1)+'px;width:'+cw.toFixed(1)+'px;height:'+(cw*.5).toFixed(1)+'px;background:'+cols[i%5]+
       ';--r:'+(R()*1080-540).toFixed(0)+'deg;animation-delay:'+(9.4+R()*.8).toFixed(3)+'s;animation-duration:'+(2.2+R()*.8).toFixed(3)+'s"></i>';
  }
  document.getElementById('confetti').innerHTML=h;

  // 3) kapanış yaprakları: kesirli tekrar sayısı → tam 15. saniyede havada donar
  h='';
  for(i=0;i<16;i++){
    var d=11.9+R()*1.4, D=3.4+R()*1.8, Ds=1.2+R()*1, ds=d-R()*Ds, pw=22+R()*18;
    h+='<i style="left:'+(R()*1040).toFixed(1)+'px;--r:'+(R()*360-180).toFixed(0)+'deg;animation-duration:'+D.toFixed(3)+'s;animation-delay:'+d.toFixed(3)+'s;animation-iteration-count:'+((T-d)/D).toFixed(6)+'">'+
       '<b style="width:'+pw.toFixed(1)+'px;height:'+(pw*1.5).toFixed(1)+'px;background:'+cols[i%4]+';opacity:.92;animation-duration:'+Ds.toFixed(3)+'s;animation-delay:'+ds.toFixed(3)+'s;animation-iteration-count:'+((T-ds)/Ds).toFixed(6)+'"></b></i>';
  }
  document.getElementById('petals').innerHTML=h;
})();
</script>
</body>
</html>
