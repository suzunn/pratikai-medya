<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kırk Sümbül Çiçekçilik · Reklam 2 · Aynı Gün Teslim</title>
<!--
  Reklam 2 — Aynı gün teslim · 15 sn · 1080x1920 · son karede durur
  0.0–1.1   Açılış: üç renk şeridi yukarı kalkar
  1.0–4.7   "Bugün SİPARİŞ VER" yanlardan kayar; çalar saat kurulur, akrep 14.00'e döner, saat çalar
  4.8–11.5  "Aynı gün KAPINDA!"; marka arabası gelir, kapı açılır, buket kapıya zıplar
  11.6–15   Kapanış: şeritler iner, logo yuvarlanarak gelir, "Sipariş için bize yaz"
  Tüm hareketler CSS @keyframes (saniye); bulut ve güneş hareketleri tam 15. saniyede biter.
  Baştan oynatmak için sayfayı yenileyin (F5).
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#12081a;cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;margin:-960px 0 0 -540px;transform:scale(var(--s,.3333));overflow:hidden;color:#2b1238;
  background:radial-gradient(520px 520px at 0% 8%,#e6d9fa 0%,rgba(230,217,250,0) 100%),radial-gradient(640px 640px at 100% 92%,#ecdffb 0%,rgba(236,223,251,0) 100%),#fff6ec;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
.serif{font-family:Georgia,"Times New Roman",Times,serif}
.ornek{display:inline-block;font:600 30px/1 "Segoe UI",system-ui,sans-serif;font-style:normal;letter-spacing:1px;padding:7px 16px 9px;border:3px solid currentColor;border-radius:999px;vertical-align:middle;opacity:.9}
.fb{transform-box:fill-box;transform-origin:center}

/* açılış şeritleri */
.band{position:absolute;top:0;width:361px;height:1920px;z-index:30;animation:bandUp .7s cubic-bezier(.7,0,.3,1) both}
.b1{left:0;background:#2b1238;animation-delay:.15s}.b2{left:360px;background:#9b7fd4;animation-delay:.27s}.b3{left:720px;background:#f2b544;animation-delay:.39s}
@keyframes bandUp{from{transform:none}to{transform:translateY(-105%)}}

/* marka rozeti */
.chip{position:absolute;top:236px;left:0;width:100%;display:flex;justify-content:center;z-index:5;animation:chipIn .7s cubic-bezier(.2,.8,.3,1) .9s both}
.chip>div{display:flex;align-items:center;gap:16px;padding:8px 32px 8px 8px;border-radius:999px;background:#2b1238;color:#fff6ec}
.chip svg{width:68px;height:68px;display:block}
.chip span{font:italic 40px/1 Georgia,"Times New Roman",serif}
@keyframes chipIn{from{transform:translateY(-50px);opacity:0}to{transform:none;opacity:1}}

/* başlık */
.t1,.t2{position:absolute;left:0;width:100%;text-align:center;z-index:5;white-space:nowrap}
.t1{top:322px;height:130px;font-size:116px;line-height:1.1;font-style:italic;color:#7a5bc4}
.t2{top:452px;height:170px;font-size:140px;line-height:1.1;font-weight:900}
.t1 span,.t2>div{position:absolute;left:0;top:0;width:100%}
.t2 span{display:inline-block}
.bg1{animation:dropIn .6s cubic-bezier(.2,.8,.3,1.2) 1.0s both,upAway .4s ease-in 4.75s forwards}
.bg2{animation:riseIn .6s cubic-bezier(.2,.8,.3,1.2) 4.95s both}
.w1{animation:inL .6s cubic-bezier(.2,.9,.3,1.1) 1.2s both,outL .45s cubic-bezier(.7,0,1,.5) 4.75s forwards}
.w2{animation:inR .6s cubic-bezier(.2,.9,.3,1.1) 1.38s both,outR .45s cubic-bezier(.7,0,1,.5) 4.75s forwards}
.w3{animation:slam .55s cubic-bezier(.3,.8,.35,1.15) 5.05s both}
.bar{position:absolute;left:250px;top:150px;width:580px;height:18px;border-radius:9px;background:#f2b544;transform-origin:left;animation:barIn .5s ease-out 5.5s both}
@keyframes dropIn{from{transform:translateY(-120px);opacity:0}to{transform:none;opacity:1}}
@keyframes riseIn{from{transform:translateY(120px);opacity:0}to{transform:none;opacity:1}}
@keyframes upAway{from{transform:none;opacity:1}to{transform:translateY(-120px);opacity:0}}
@keyframes inL{0%{transform:translateX(-1100px) skewX(-25deg);opacity:0}70%{transform:translateX(20px) skewX(8deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes inR{0%{transform:translateX(1100px) skewX(25deg);opacity:0}70%{transform:translateX(-20px) skewX(-8deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes outL{from{transform:none;opacity:1}to{transform:translateX(-1200px) skewX(25deg);opacity:0}}
@keyframes outR{from{transform:none;opacity:1}to{transform:translateX(1200px) skewX(-25deg);opacity:0}}
@keyframes slam{0%{transform:scale(2.6) rotate(-6deg);opacity:0}60%{transform:scale(.94) rotate(1deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes barIn{from{transform:scaleX(0)}to{transform:none}}

/* saat sahnesi */
.clockIn{animation:popIn .55s cubic-bezier(.3,.8,.35,1.3) .7s both}
.clockOut{animation:clockOut .5s ease-in 4.75s forwards}
.rim{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease-out .85s both}
.ticks{animation:fadeIn .4s ease-out 1.25s both}
.hh{animation:hh 1.6s cubic-bezier(.45,0,.2,1) 1.4s both}
.mh{animation:mh 1.6s cubic-bezier(.45,0,.2,1) 1.4s both}
.shake{animation:shake .6s ease-in-out 3.0s 1}
.ring{opacity:0;animation:ring .9s ease-out 3.0s both}
.stalk{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.3,.8,.3,1.1) var(--d) both,fadeDown .45s ease-in 4.75s forwards}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
@keyframes clockOut{from{transform:none;opacity:1}to{transform:scale(0) rotate(160deg);opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes hh{from{transform:rotate(270deg)}to{transform:rotate(420deg)}}
@keyframes mh{from{transform:rotate(0deg)}to{transform:rotate(1800deg)}}
@keyframes shake{0%,100%{transform:none}15%,45%,75%{transform:rotate(-5deg)}30%,60%,90%{transform:rotate(5deg)}}
@keyframes ring{0%{transform:scale(1);opacity:0}8%{opacity:.9}100%{transform:scale(1.45);opacity:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes fadeDown{from{transform:none;opacity:1}to{transform:translateY(60px);opacity:0}}

/* teslimat sahnesi */
.road{animation:roadIn .6s cubic-bezier(.3,.8,.3,1) 4.95s both}
.house{animation:houseIn .7s cubic-bezier(.3,.8,.35,1.25) 5.1s both}
.sunIn{animation:popIn .6s cubic-bezier(.3,.8,.35,1.3) 5.25s both}
.rays{animation:spin 9.75s linear 5.25s both}
.van{animation:drive 1.8s cubic-bezier(.15,.75,.25,1) 5.4s both}
.wheel{animation:roll 1.8s cubic-bezier(.15,.75,.25,1) 5.4s both}
.vbob{transform-box:fill-box;transform-origin:50% 100%;animation:bob .2s ease-in-out 5.4s 9,brake .45s ease-out 7.2s 1}
.spd{animation:spd 1.8s linear 5.4s both}
.door{transform-box:fill-box;transform-origin:0 50%;animation:door .5s cubic-bezier(.3,.7,.3,1) 7.35s both}
.hopx{animation:hopx .8s linear 7.6s both}
.hopy{animation:hopy .8s 7.6s both}
.hrt{animation:hrt 1.5s ease-out var(--d) both}
@keyframes roadIn{from{transform:scaleX(0)}to{transform:none}}
@keyframes houseIn{from{transform:translateY(260px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(110deg)}}
@keyframes drive{from{transform:translateX(-1000px)}to{transform:none}}
@keyframes roll{from{transform:rotate(0deg)}to{transform:rotate(1680deg)}}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-6px)}}
@keyframes brake{0%,100%{transform:none}40%{transform:rotate(1.6deg)}}
@keyframes spd{0%{opacity:0}10%{opacity:.9}75%{opacity:.9}100%{opacity:0}}
@keyframes door{from{transform:none}to{transform:scaleX(.14)}}
@keyframes hopx{0%{transform:translateX(-420px);opacity:0}10%{opacity:1}100%{transform:none;opacity:1}}
@keyframes hopy{0%{transform:translateY(-150px);animation-timing-function:cubic-bezier(.3,.6,.5,1)}45%{transform:translateY(-330px);animation-timing-function:cubic-bezier(.5,0,.7,.4)}100%{transform:none}}
@keyframes hrt{0%{transform:translateY(0) scale(.2);opacity:0}20%{transform:translateY(-30px) scale(1);opacity:1}100%{transform:translateY(-220px) scale(.8);opacity:0}}

/* saat bandı (fiyat yerine saat) */
.pillw{position:absolute;top:1170px;left:0;width:100%;display:flex;justify-content:center;z-index:6}
.pill{display:flex;align-items:center;gap:18px;padding:20px 34px 22px 26px;border-radius:999px;background:#2b1238;color:#fff6ec;font-weight:700;font-size:54px;line-height:1;white-space:nowrap;
  box-shadow:0 16px 40px rgba(43,18,56,.3);animation:popIn .55s cubic-bezier(.3,.8,.35,1.35) 3.15s both,bump .5s ease-in-out 10.2s 1}
.pill b{color:#f2b544}
.pill .ornek{color:#d9c8f5}
.pill svg{width:60px;height:60px;flex:none}
@keyframes bump{0%,100%{transform:none}50%{transform:scale(1.07)}}
.words{position:absolute;top:1312px;left:0;width:100%;text-align:center;font-size:52px;font-style:italic;color:#7a5bc4;z-index:5;white-space:nowrap}
.words span{display:inline-block;animation:wordPop .45s cubic-bezier(.3,.8,.35,1.4) var(--d) both}
@keyframes wordPop{from{transform:translateY(40px) scale(.5);opacity:0}to{transform:none;opacity:1}}

/* bulutlar: tek geçiş, 15. sn'de biter */
.cl1{animation:cloud1 15s linear both}.cl2{animation:cloud2 15s linear both}
@keyframes cloud1{from{transform:translateX(-260px)}to{transform:translateX(1180px)}}
@keyframes cloud2{from{transform:translateX(1180px)}to{transform:translateX(-120px)}}

/* kapanış */
.col{position:absolute;top:0;width:361px;height:1920px;z-index:20;background:#2b1238;animation:colDown .6s cubic-bezier(.7,0,.3,1) both}
.c1{left:0;animation-delay:11.55s}.c2{left:360px;animation-delay:11.67s}.c3{left:720px;animation-delay:11.79s}
@keyframes colDown{from{transform:translateY(-105%)}to{transform:none}}
#end{z-index:21;color:#fff6ec}
.glow{background:radial-gradient(70% 45% at 50% 45%,#4c2263 0%,rgba(43,18,56,0) 100%);animation:fadeIn .8s ease-out 12.1s both}
.e-emb{position:absolute;left:375px;top:420px;width:330px;height:330px;animation:rollIn 1s cubic-bezier(.2,.8,.3,1) 12.15s both}
@keyframes rollIn{from{transform:translateX(-820px) rotate(-560deg)}to{transform:none}}
.e-name{position:absolute;top:790px;left:0;width:100%;text-align:center;font-size:128px;line-height:1.05;font-style:italic}
.e-name span{display:inline-block;animation:key .25s ease-out calc(12.65s + var(--i) * .07s) both}
@keyframes key{from{transform:scale(1.8);opacity:0}to{transform:none;opacity:1}}
.e-sub{position:absolute;top:950px;left:0;width:100%;text-align:center;font-weight:600;font-size:44px;letter-spacing:22px;padding-left:22px;color:#cdb6f5;animation:riseIn .6s ease-out 13.4s both}
.e-line{position:absolute;top:1030px;left:410px;width:260px;height:4px;border-radius:2px;background:#f2b544;animation:barIn .6s ease-out 13.5s both}
.ctaw{position:absolute;top:1074px;left:0;width:100%;display:flex;justify-content:center}
.cta{display:flex;align-items:center;gap:20px;padding:26px 48px 28px 40px;border-radius:999px;background:#f2b544;color:#2b1238;font-weight:800;font-size:54px;line-height:1;white-space:nowrap;
  box-shadow:0 16px 44px rgba(242,181,68,.35);animation:ctaSlide .7s cubic-bezier(.2,.8,.3,1) 13.6s both,honk .6s ease-in-out 14.25s 1}
.cta svg{width:62px;height:62px;flex:none}
@keyframes ctaSlide{0%{transform:translateX(900px)}70%{transform:translateX(-24px)}100%{transform:none}}
@keyframes honk{0%,100%{transform:none}20%,60%{transform:rotate(-3deg) scale(1.04)}40%,80%{transform:rotate(3deg) scale(1.04)}}
.remind{position:absolute;top:1228px;left:0;width:100%;text-align:center;font-size:38px;color:rgba(255,246,236,.88);white-space:nowrap;animation:riseIn .6s ease-out 13.9s both}
.remind .ornek{margin:0 12px;color:#cdb6f5}
</style>
</head>
