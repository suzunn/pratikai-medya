<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Mavi Fincanlık · Gönderi</title>
<!--
  Mavi Fincanlık (kurgusal mahalle kafesi) için 1080x1350 Instagram gönderi şablonu.
  Gösterilecek gönderi adresin sonundaki #1 ... #30 ile seçilir (ör. sablon.html#7).
  Tarayıcıda gezinmek için sağ/sol ok tuşları da çalışır.
  Hiçbir dış kaynak kullanılmaz: yazı tipleri sistem fontları, süslemeler CSS/SVG.
  Tüm içerik uydurmadır.
-->
<style>
:root{
  --serif: Georgia, "Palatino Linotype", "Book Antiqua", "Times New Roman", serif;
  --sans: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#1b2f4b}

.post{
  --k:1;
  position:relative;width:1080px;height:1350px;overflow:hidden;
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  display:flex;flex-direction:column;padding:70px 78px 60px;
}
.cerceve{position:absolute;inset:30px;border:3px solid var(--line);border-radius:38px;pointer-events:none;z-index:3}
.susler{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ust,.icerik,.alt{position:relative;z-index:2}

/* Üst bant: marka + tür etiketi */
.ust{display:flex;align-items:center;justify-content:space-between;gap:24px}
.marka{display:flex;align-items:center;gap:18px}
.logo{width:86px;height:86px;flex:none}
.marka-ad{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1}
.marka-alt{font-size:17px;letter-spacing:5px;text-transform:uppercase;opacity:.75;margin-top:8px}
.etiket{font-size:21px;font-weight:700;letter-spacing:3px;padding:14px 26px;border-radius:999px;background:var(--accent);color:var(--onaccent);white-space:nowrap}

/* İçerik alanı */
.icerik{flex:1;min-height:0;margin:44px 0 30px;overflow:hidden;display:flex;flex-direction:column}
.govde{flex:1 0 auto;display:flex;flex-direction:column}
.govde>*{flex-shrink:0}

/* Alt bant */
.alt{display:flex;justify-content:space-between;align-items:center;font-size:21px;letter-spacing:1px;border-top:2px solid var(--line);padding-top:22px}
.alt .no{font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:2px}

/* Ortak yazı ölçüleri (--k taşma olursa küçültülür) */
.kucuk{font-size:calc(26px*var(--k));letter-spacing:5px;text-transform:uppercase;font-weight:700;color:var(--accent)}
h1{font-family:var(--serif);font-weight:700;line-height:1.06;font-size:calc(92px*var(--k));letter-spacing:-1px}
p{font-size:calc(34px*var(--k));line-height:1.45}

/* ---------- MENÜDEN ---------- */
.urun{align-items:center;text-align:center;justify-content:space-between}
.urun .sahne{position:relative;width:100%;height:calc(570px*var(--k));display:flex;align-items:center;justify-content:center}
.urun .daire{position:absolute;width:calc(540px*var(--k));height:calc(540px*var(--k));border-radius:50%;background:var(--soft)}
.urun .daire::after{content:"";position:absolute;inset:-22px;border-radius:50%;border:3px dashed var(--line)}
.urun .cizim{position:relative;width:calc(500px*var(--k));height:auto}
.fiyat{
  position:absolute;right:30px;bottom:20px;
  width:calc(230px*var(--k));height:calc(230px*var(--k));border-radius:50%;
  background:var(--accent);color:var(--onaccent);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transform:rotate(-8deg);box-shadow:0 0 0 8px var(--bg),0 0 0 11px var(--accent);
}
.fiyat b{font-family:var(--serif);font-size:calc(92px*var(--k));line-height:.9}
.fiyat span{font-size:calc(28px*var(--k));font-weight:700;letter-spacing:4px;margin-top:6px}
.urun .metin{display:flex;flex-direction:column;align-items:center;gap:calc(16px*var(--k))}
.urun p{max-width:840px;opacity:.85}
.minietiket{display:inline-block;font-size:calc(21px*var(--k));font-weight:700;letter-spacing:2px;padding:8px 20px;border:2px solid var(--ink);border-radius:999px;text-transform:uppercase}
.urun.b{flex-direction:column-reverse;align-items:flex-start;text-align:left}
.urun.b .metin{align-items:flex-start}
/* Kesik çizgili halka (daire + 2×22px) sahneden taşarsa column-reverse'de içeriğin altından taşar
   ve sigdir() --k'yı 0.6'ya kadar küçültür; sahneyi halkayı kapsayacak kadar uzatıyoruz. */
.urun.b .sahne{justify-content:flex-end;height:calc(540px*var(--k) + 46px)}
.urun.b .daire{margin-right:20px}
.urun.b .cizim{margin-right:40px}
.urun.b .fiyat{left:20px;right:auto;bottom:auto;top:60px;transform:rotate(8deg)}

/* ---------- KAMPANYA ---------- */
.kampanya{gap:calc(14px*var(--k))}
.kampanya .dev{font-family:var(--serif);font-weight:700;font-size:calc(250px*var(--k));line-height:.95;color:var(--accent);white-space:nowrap;overflow:hidden;letter-spacing:-6px;margin:calc(6px*var(--k)) 0 calc(10px*var(--k))}
.kampanya h1{font-size:calc(84px*var(--k))}
.kampanya p{max-width:880px}
.kupon{margin-top:auto;border:3px dashed currentColor;border-radius:24px;padding:calc(26px*var(--k)) 36px;font-size:calc(26px*var(--k));line-height:1.4;display:flex;gap:24px;align-items:center}
.kupon svg{width:calc(46px*var(--k));flex:none}
.damgalar{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(22px*var(--k));margin:calc(28px*var(--k)) 0 calc(20px*var(--k));max-width:780px}
.damga{aspect-ratio:1;border-radius:50%;border:4px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.damga svg{width:60%;opacity:.85}
.damga.son{background:var(--accent);color:var(--onaccent);border:none;font-weight:800;font-size:calc(22px*var(--k));letter-spacing:2px;text-align:center;line-height:1.1;transform:rotate(-6deg)}
.isinlar{position:absolute;width:1900px;height:1900px;left:28%;top:36%;transform:translate(-50%,-50%);border-radius:50%;
  background:repeating-conic-gradient(var(--soft) 0deg 6deg,transparent 6deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%)}
.damla{position:absolute;width:5px;border-radius:3px;background:var(--ink);opacity:.2;transform:rotate(14deg)}

/* ---------- ÇALIŞMA SAATLERİ ---------- */
.saatler{gap:calc(16px*var(--k))}
.saatler .bas{display:flex;align-items:center;justify-content:space-between;gap:30px}
.saatler .bas>div{display:flex;flex-direction:column;gap:calc(16px*var(--k))}
.saat-svg{width:calc(220px*var(--k));flex:none;color:var(--ink)}
.tablo{margin-top:calc(46px*var(--k));display:flex;flex-direction:column;gap:calc(32px*var(--k))}
.satir{display:flex;align-items:baseline;font-size:calc(46px*var(--k))}
.satir span{font-weight:600;white-space:nowrap}
.satir i{flex:1;border-bottom:4px dotted var(--line);margin:0 22px;transform:translateY(-10px)}
.satir b{font-family:var(--serif);font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.saatler .not{margin-top:auto;font-size:calc(28px*var(--k));line-height:1.45;padding:calc(26px*var(--k)) 34px;background:var(--soft);border-left:8px solid var(--accent);border-radius:0 18px 18px 0}
.noktalar{position:absolute;inset:0;background-image:radial-gradient(rgba(143,184,232,.17) 3px,transparent 3.5px);background-size:44px 44px;
  -webkit-mask:linear-gradient(160deg,#000 0%,transparent 60%);mask:linear-gradient(160deg,#000 0%,transparent 60%)}

/* ---------- MÜŞTERİ YORUMU ---------- */
.yorum{justify-content:center;align-items:center}
.kart{position:relative;width:100%;background:var(--soft);border-radius:28px;padding:calc(80px*var(--k)) calc(70px*var(--k)) calc(60px*var(--k));
  box-shadow:0 30px 60px rgba(27,47,75,.16);transform:rotate(var(--egim))}
.bant{position:absolute;top:-26px;left:50%;width:220px;height:56px;background:var(--accent);opacity:.8;transform:translateX(-50%) rotate(-3deg)}
.tirnak{font-family:var(--serif);font-size:calc(240px*var(--k));line-height:.62;height:calc(100px*var(--k));color:var(--accent)}
.yildizlar{display:flex;gap:10px;margin:calc(10px*var(--k)) 0 calc(28px*var(--k))}
.yildizlar svg{width:calc(44px*var(--k))}
blockquote{font-family:var(--serif);font-style:italic;font-size:calc(58px*var(--k));line-height:1.3}
.imza{margin-top:calc(46px*var(--k));display:flex;align-items:center;gap:20px;font-family:var(--serif);font-weight:700;font-size:calc(42px*var(--k))}
.imza .cizgi{width:70px;height:4px;background:var(--accent)}
.imza small{margin-left:auto;font-family:var(--sans);font-weight:600;font-size:calc(21px*var(--k));letter-spacing:3px;text-transform:uppercase;opacity:.6}
.yorum .davet{margin-top:calc(54px*var(--k));font-size:calc(28px*var(--k));opacity:.75;text-align:center}
.cizgiler{position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.4) 0 2px,transparent 2px 30px)}

/* ---------- HAFTANIN ETKİNLİĞİ ---------- */
.etkinlik{gap:calc(22px*var(--k))}
.etk-ust{display:flex;align-items:center;gap:calc(50px*var(--k));margin:calc(16px*var(--k)) 0 calc(22px*var(--k))}
.takvim{width:calc(290px*var(--k));flex:none;background:#f6efe4;color:#1b2f4b;border-radius:28px;overflow:hidden;text-align:center;
  box-shadow:0 22px 0 -8px rgba(0,0,0,.2);transform:rotate(-3deg)}
.takvim .ay{background:var(--accent);color:var(--onaccent);font-weight:800;letter-spacing:5px;font-size:calc(30px*var(--k));padding:calc(16px*var(--k)) 0;text-transform:uppercase}
.takvim .gun{font-family:var(--serif);font-weight:700;font-size:calc(170px*var(--k));line-height:1.05}
.takvim .hg{font-size:calc(30px*var(--k));font-weight:600;padding-bottom:calc(22px*var(--k));opacity:.75}
.etk-bilgi{flex:1;display:flex;flex-direction:column;gap:calc(26px*var(--k))}
.etk-satir{display:flex;align-items:center;gap:18px;font-size:calc(38px*var(--k));font-weight:600;line-height:1.2}
.etk-satir svg{width:calc(48px*var(--k));flex:none;color:var(--accent)}
.ikon{width:calc(150px*var(--k));color:var(--accent);align-self:flex-end;margin-top:calc(-10px*var(--k))}
.etkinlik p{opacity:.9;max-width:900px}
.rozetler{margin-top:auto;display:flex;gap:18px;flex-wrap:wrap}
.rozet{font-size:calc(28px*var(--k));font-weight:700;padding:14px 30px;border-radius:999px;border:3px solid var(--ink)}
.rozet.dolu{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.konfeti{position:absolute}

/* ---------- KAHVE BİLGİSİ ---------- */
.bilgi{gap:calc(18px*var(--k))}
.bilgi .soru{font-family:var(--serif);font-style:italic;font-size:calc(46px*var(--k))}
.rakam{font-family:var(--serif);font-weight:700;font-size:calc(230px*var(--k));line-height:1;color:var(--accent);white-space:nowrap;overflow:hidden;letter-spacing:-4px;margin:calc(4px*var(--k)) 0 calc(6px*var(--k))}
.rakam small{font-size:.3em;letter-spacing:1px;margin-left:18px}
.ayrac{display:flex;align-items:center;gap:18px;margin-bottom:calc(10px*var(--k))}
.ayrac i{height:3px;width:120px;background:var(--accent);opacity:.6}
.ayrac svg{width:30px}
.bilgi p{opacity:.9}
.bilgi .son-not{margin-top:auto;font-size:calc(27px*var(--k));opacity:.75;font-style:italic;font-family:var(--serif)}
.cekirdek{position:absolute;opacity:.15}

/* Menü süsleri */
.balon{position:absolute;border-radius:50%;background:var(--soft)}
.dalga{position:absolute;left:0;width:1080px}
</style>
</head>

/* Tekrarlanabilir rastgelelik: aynı gönderi her basışta aynı görünsün */
function rng(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 2 ** 32;
  };
}

function saatKadrani(hhmm){
  const [h, m] = hhmm.split(":").map(Number);
  const ha = ((h % 12) + m / 60) * 30, ma = m * 6;
  let cizgiler = "";
  for (let i = 0; i < 12; i++){
    const uzun = i % 3 === 0;
    cizgiler += `<line x1="100" y1="${uzun ? 18 : 22}" x2="100" y2="${uzun ? 36 : 30}" stroke="currentColor" stroke-width="${uzun ? 6 : 4}" stroke-linecap="round" transform="rotate(${i * 30} 100 100)"/>`;
  }
  return `<svg class="saat-svg" viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="100" cy="100" r="94" style="fill:var(--soft)" stroke="currentColor" stroke-width="6"/>${cizgiler}
    <line x1="100" y1="100" x2="100" y2="56" stroke="currentColor" stroke-width="11" stroke-linecap="round" transform="rotate(${ha} 100 100)"/>
    <line x1="100" y1="100" x2="100" y2="34" style="stroke:var(--accent)" stroke-width="6" stroke-linecap="round" transform="rotate(${ma} 100 100)"/>
    <circle cx="100" cy="100" r="9" style="fill:var(--accent)"/>
  </svg>`;
}

/* ===================== GÖVDE ŞABLONLARI ===================== */
const GOVDE = {
  urun(g){

    return `<div class="govde urun ${g.yer === "b" ? "b" : ""}">

        <p>${g.aciklama}</p>
      </div>

  },

  kampanya(g, n){
    let orta = "";
    if (g.damga){
      const r = rng(n * 31);
      let kutular = "";
      for (let i = 1; i <= 9; i++)
        kutular += `<div class="damga"><span style="display:contents">${KUCUK_FINCAN.replace("<svg", `<svg style="transform:rotate(${Math.round(r() * 40 - 20)}deg)"`)}</span></div>`;

      orta = `<div class="damgalar">${kutular}</div>`;
    } else {
      orta = `<div class="dev">${g.buyuk}</div>`;
    }
    return `<div class="govde kampanya">
      <div class="kucuk">${g.ust}</div>
      ${orta}
      <h1>${g.baslik}</h1>
      <p>${g.aciklama}</p>
      <div class="kupon">${MAKAS}<span>${g.kosul}</span></div>

    return `<div class="govde saatler">
      <div class="bas"><div><div class="kucuk">${g.ust}</div><h1>${g.baslik}</h1></div>${saatKadrani(g.satirlar[0][1].split(" ")[0])}</div>

  yorum(g, n){

/* ===================== ARKA PLAN SÜSLERİ ===================== */
function susler(g, n){
  const r = rng(n * 977 + 13);
  switch (g.tur){
    case "urun": {
      const balon = g.yer === "b"
        ? `<div class="balon" style="width:760px;height:760px;left:-300px;top:-260px"></div>`
        : `<div class="balon" style="width:720px;height:720px;right:-320px;bottom:-200px"></div>`;
      const dalga = `<svg class="dalga" style="top:${g.yer === "b" ? 1180 : 120}px" viewBox="0 0 1080 60" aria-hidden="true">
        <path d="M0 30q45-26 90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0" fill="none" style="stroke:var(--line)" stroke-width="4"/></svg>`;
      return balon + dalga;
    }
    case "kampanya": {
      let s = `<div class="isinlar"></div>`;
      if (g.yagmur){
        for (let i = 0; i < 46; i++)
          s += `<span class="damla" style="left:${(r() * 1080).toFixed(0)}px;top:${(r() * 1350).toFixed(0)}px;height:${(24 + r() * 40).toFixed(0)}px"></span>`;
      }
      return s;
    }
    case "saatler":
      return `<div class="noktalar"></div>`;
    case "yorum":
      return `<div class="cizgiler"></div>`;
    case "etkinlik": {
      let s = "";
      for (let i = 0; i < 38; i++){
        const boy = 8 + r() * 18, yuvarlak = r() < .5;
        const renk = r() < .6 ? "var(--accent)" : "var(--ink)";
        s += `<span class="konfeti" style="left:${(r() * 1080).toFixed(0)}px;top:${(r() * 1350).toFixed(0)}px;width:${boy.toFixed(0)}px;height:${(yuvarlak ? boy : boy * .45).toFixed(0)}px;background:${renk};border-radius:${yuvarlak ? "50%" : "2px"};opacity:${(.15 + r() * .2).toFixed(2)};transform:rotate(${(r() * 180).toFixed(0)}deg)"></span>`;
      }
      return s;
    }
    case "bilgi": {
      let s = "";
      for (let i = 0; i < 16; i++){
        const w = 40 + r() * 54;
        s += CEKIRDEK.replace("<svg", `<svg class="cekirdek" style="left:${(r() * 1080).toFixed(0)}px;top:${(r() * 1350).toFixed(0)}px;width:${w.toFixed(0)}px;transform:translate(-50%,-50%) rotate(${(r() * 360).toFixed(0)}deg)"`);
      }
      return s;
    }
  }
  return "";
}

/* ===================== ÇİZİM VE SIĞDIRMA ===================== */
function secili(){
  const n = parseInt((location.hash || "#1").replace("#", ""), 10);
  return Math.min(GONDERILER.length, Math.max(1, isNaN(n) ? 1 : n));
}

function sigdir(post){
  const ic = post.querySelector(".icerik");
  let k = 1;
  while (ic.scrollHeight > ic.clientHeight + 1 && k > 0.6){
    k = +(k - 0.03).toFixed(2);
    post.style.setProperty("--k", k);
  }
  post.querySelectorAll(".dev, .rakam").forEach(el => {
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && fs > 60){
      fs -= 6;
      el.style.fontSize = fs + "px";
    }
  });
}

function ciz(){
  const n = secili();
  const g = GONDERILER[n - 1];
  const tema = g.tur === "kampanya" ? TEMALAR["kampanya_" + (g.ton || "mavi")] : TEMALAR[g.tur];
  const post = document.getElementById("post");

  post.className = "post tur-" + g.tur;
  post.removeAttribute("style");
  for (const [ad, deger] of Object.entries(tema)) post.style.setProperty("--" + ad, deger);
  if (g.tur === "urun" && g.vurgu) post.style.setProperty("--accent", g.vurgu);
  post.style.setProperty("--k", 1);

  post.innerHTML = `
    <div class="susler">${susler(g, n)}</div>
    <div class="cerceve"></div>
    <header class="ust">
      <div class="marka">${LOGO}<div><div class="marka-ad">Mavi Fincanlık</div><div class="marka-alt">Mahalle Kahvecisi</div></div></div>
      <div class="etiket">${g.ust_etiket || ETIKETLER[g.tur]}</div>
    </header>
    <main class="icerik">${GOVDE[g.tur](g, n)}</main>
    <footer class="alt">
      <span>Mavi Fincanlık · mahallenin mavi kapılı kahvecisi</span>
      <span class="no">${iki(n)} / ${iki(GONDERILER.length)}</span>
    </footer>`;

  sigdir(post);
  document.title = `Mavi Fincanlık · Gönderi ${iki(n)}`;
}

window.addEventListener("hashchange", ciz);
window.addEventListener("keydown", e => {
  const n = secili();
  if (e.key === "ArrowRight") location.hash = "#" + (n % GONDERILER.length + 1);
  if (e.key === "ArrowLeft")  location.hash = "#" + ((n + GONDERILER.length - 2) % GONDERILER.length + 1);
});
ciz();
</script>
